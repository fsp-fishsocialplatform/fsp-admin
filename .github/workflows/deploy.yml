# Builds the Vite app and publishes dist/ to GitHub Pages on every push to the
# release branch — matching the other repos (fsp-mobile-app/fsp-backend), where
# pushing to `release` is the deploy trigger and `main` is just integration.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source = "GitHub Actions". No branch/folder selection needed; this workflow
# uploads the artifact and deploys it directly.
name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:

# Permissions the Pages deploy action requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one, but don't cancel a run that's
# mid-deploy (could leave Pages half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Served from https://<org>.github.io/fsp-admin/ — must match the repo
          # name. Backend URL comes from the committed .env (VITE_API_BASE_URL).
          BASE_PATH: /fsp-admin/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
